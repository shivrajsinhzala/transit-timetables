# www.stopwatchtimetables.com -> stopwatchtimetables.com, same path and query.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/ssl/stopwatchtimetables.pem;
  ssl_certificate_key /etc/ssl/stopwatchtimetables.key;
  server_name www.stopwatchtimetables.com;
  return 301 https://stopwatchtimetables.com$request_uri;
}

# The old host, until the switch: the same site, from its own block and certificate.
