# Generated by scripts/make-migration.mjs (MIGRATION_REDIRECTS=on). Included at the top of deploy/nginx.conf.

# www.stopwatchtimetables.com -> stopwatchtimetables.com, same path and query.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/ssl/stopwatchtimetables.pem;
  ssl_certificate_key /etc/ssl/stopwatchtimetables.key;
  server_name www.stopwatchtimetables.com;
  return 301 https://stopwatchtimetables.com$request_uri;
}

# The old host: every request 301s to the same path and query on https://stopwatchtimetables.com, never the homepage.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/ssl/stopwatch.pem;
  ssl_certificate_key /etc/ssl/stopwatch.key;
  server_name transit.shivrajsinh.in;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Installed users: a worker that clears the old caches, unregisters and reloads into the 301.
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    return 200 "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',(e)=>e.waitUntil((async()=>{for(const k of await caches.keys())await caches.delete(k);await self.registration.unregister();for(const c of await self.clients.matchAll({type:'window'}))c.navigate(c.url);})()));";
  }

  location / {
    return 301 https://stopwatchtimetables.com$request_uri;
  }
}
