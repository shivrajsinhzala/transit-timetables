# Stopwatch on our own server: nginx serving the static build that scripts/deploy-server.mjs
# puts in /var/www/stopwatch/current. Does what Cloudflare Workers did for us:
# extensionless URLs, the /bc -> /ca redirects (worker/router.js), the 404 page and the cache
# headers from public/_headers. If you change DEPLOY_PATH, change `root` below to match.
#
# Install: copy to /etc/nginx/sites-available/stopwatch, link it into sites-enabled, copy
# stopwatch-security.conf to /etc/nginx/snippets/,
# `sudo nginx -t && sudo systemctl reload nginx`, then `sudo certbot --nginx -d transit.shivrajsinh.in`
# for HTTPS (deploy/README.md).

# Exchange pages removed on 2026-10-04: each goes to its town (keep in step with GONE_HUBS in
# worker/router.js).
map $uri $stopwatch_gone_hub {
  default "";
  ~^/bc/(?<town>nanaimo|sunshine-coast|victoria)/hub/(departure-bay-rd-at|neyland-rd-at-departure|uplands-dr-at-hammond|hammond-bay-rd-at-departure|hwy-101-at|hwy-101-at-davis|bay-st-at-rock|cook-st-at|cadboro-bay-rd-at-vista|crescent-rd-at-foul|beach-dr-at-cadboro|douglas-st-at|oak-bay-ave-at-foul|quadra-st-at|tyee-rd-at|richmond-rd-at)$ /ca/$town;
}

server {
  listen 80;
  listen [::]:80;   # remove if the server has no IPv6 (nginx will not start)
  server_name transit.shivrajsinh.in;

  root /var/www/stopwatch/current;
  index index.html;
  charset utf-8;
  # Redirects say /ca, not http://host:80/ca: Cloudflare in front speaks HTTPS to visitors.
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain application/manifest+json;
  gzip_vary on;

  # Security headers on every response (public/_headers `/*`). nginx drops the server's
  # add_header lines in any location that has its own, so those locations include it again.
  include /etc/nginx/snippets/stopwatch-security.conf;

  error_page 404 /404.html;

  # British Columbia moved under Canada (October 2026).
  if ($stopwatch_gone_hub) { return 301 $stopwatch_gone_hub$is_args$args; }
  location = /bc { return 301 /ca$is_args$args; }
  location ^~ /bc/ { rewrite ^/bc/(.*)$ /ca/$1 permanent; }
  location = /search.json { return 301 /search/index.json$is_args$args; }

  # One URL per page: /x.html and /x/ go to /x, as Workers static assets did.
  location = /index.html { return 301 /$is_args$args; }
  location ~ ^(?<page>/.+)/index\.html$ { return 301 $page$is_args$args; }
  location ~ ^(?<page>/.+)\.html$ { return 301 $page$is_args$args; }
  location ~ ^(?<page>/.+)/$ { return 301 $page$is_args$args; }

  location = / { try_files /index.html =404; add_header Cache-Control "public, max-age=0, must-revalidate" always; include /etc/nginx/snippets/stopwatch-security.conf; }
  # Pages: /ca/kelowna/route-8 is route-8.html; the HTML is re-checked on every visit.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/snippets/stopwatch-security.conf;
  }
  location = /404.html { internal; }

  # Fingerprinted build output never changes under the same name.
  location ^~ /_a/     { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/snippets/stopwatch-security.conf; }
  location ^~ /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/snippets/stopwatch-security.conf; }
  location ^~ /vendor/ { types { application/javascript mjs js; text/css css; } add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/snippets/stopwatch-security.conf; }

  # Regenerated on each weekly refresh.
  location ^~ /geo/    { add_header Cache-Control "public, max-age=86400" always; include /etc/nginx/snippets/stopwatch-security.conf; }
  location ^~ /og/     { add_header Cache-Control "public, max-age=604800" always; include /etc/nginx/snippets/stopwatch-security.conf; }
  location ^~ /search/ { add_header Cache-Control "public, max-age=3600" always; include /etc/nginx/snippets/stopwatch-security.conf; }
  location ^~ /near/   { add_header Cache-Control "public, max-age=86400" always; include /etc/nginx/snippets/stopwatch-security.conf; }
  location ^~ /boards/ { add_header Cache-Control "public, max-age=3600" always; include /etc/nginx/snippets/stopwatch-security.conf; }

  # The service worker must always be re-checked, or an old one can pin old pages.
  location = /sw.js    { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/stopwatch-security.conf; }
}
