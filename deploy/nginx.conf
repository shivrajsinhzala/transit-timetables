# Stopwatch on our own server: nginx serving the static build that scripts/deploy-server.mjs
# puts in /var/www/stopwatch/current. Does what Cloudflare Workers did for us:
# extensionless URLs, the /bc -> /ca redirects (worker/router.js), the 404 page and the cache
# headers from public/_headers. If you change DEPLOY_PATH, change `root` below to match.
#
# Install: copy to /etc/nginx/sites-available/stopwatch, link it into sites-enabled, copy
# stopwatch-site.conf, stopwatch-old-host.conf, stopwatch-security.conf, stopwatch-moved.conf,
# headway-moved.conf and busclock-moved.conf to /etc/nginx/snippets/ and tls-keepalive.conf and
# 00-map-hash.conf to /etc/nginx/conf.d/, then `sudo nginx -t && sudo systemctl reload nginx`
# (deploy/README.md). The host names come from SITE_URL: run scripts/make-migration.mjs, which
# writes stopwatch-old-host.conf and the server_name below, before copying.

# Exchange pages removed on 2026-10-04: each goes to its town (keep in step with GONE_HUBS in
# worker/router.js).
map $uri $stopwatch_gone_hub {
  default "";
  ~^/bc/(?<town>nanaimo|sunshine-coast|victoria)/hub/(departure-bay-rd-at|neyland-rd-at-departure|uplands-dr-at-hammond|hammond-bay-rd-at-departure|hwy-101-at|hwy-101-at-davis|bay-st-at-rock|cook-st-at|cadboro-bay-rd-at-vista|crescent-rd-at-foul|beach-dr-at-cadboro|douglas-st-at|oak-bay-ave-at-foul|quadra-st-at|tyee-rd-at|richmond-rd-at)$ /ca/$town;
}

# Pages that also live on Headway or BusClock (scripts/headway-migration.mjs, busclock-migration.mjs).
# They are still served here, so a visitor from ChatGPT or Bing stays on Stopwatch, but Googlebot
# alone is told noindex: Google then indexes only the copy on the new site. The header applies to
# every client, so this is not cloaking.
# Long URLs need bigger hash buckets: deploy/00-map-hash.conf (in /etc/nginx/conf.d/, read before any map).
map $uri $stopwatch_google_noindex {
  default "";
  include /etc/nginx/snippets/headway-moved.conf;
  include /etc/nginx/snippets/busclock-moved.conf;
}

# www, and the old host (served as before, or 301s once MIGRATION_REDIRECTS=on).
include /etc/nginx/snippets/stopwatch-old-host.conf;

server {
  listen 80;
  listen [::]:80;   # remove if the server has no IPv6 (nginx will not start)
  # Cloudflare connects over HTTPS (Full strict); without these, uncached pages 404.
  # A Cloudflare Origin CA certificate for the SITE_URL host (deploy/README.md).
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/ssl/stopwatchtimetables.pem;
  ssl_certificate_key /etc/ssl/stopwatchtimetables.key;
  include /etc/nginx/snippets/stopwatch-hosts.conf;
  include /etc/nginx/snippets/stopwatch-site.conf;
}
