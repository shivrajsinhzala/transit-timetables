# Cloudflare opens a fresh connection to this server for most uncached pages (Googlebot crawls
# from the US, this server is in Mumbai: each round trip is ~250 ms). Resumed TLS sessions and
# long-lived idle connections save round trips on every one. Added 28 Oct 2026 (Stopwatch).
ssl_session_cache shared:SSL:20m;
ssl_session_timeout 1d;
keepalive_timeout 300s;
keepalive_requests 10000;
